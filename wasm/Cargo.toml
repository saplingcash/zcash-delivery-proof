[package]
name = "zcash-delivery-proof-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "zcash-delivery-proof as WebAssembly: make and check delivery proofs in a browser or in Node."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zcash-delivery-proof = { path = ".." }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
zcash_protocol = "0.10"
getrandom = { version = "0.2", features = ["js"] }

[profile.release]
opt-level = "s"
lto = true
